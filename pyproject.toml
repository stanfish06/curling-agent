[project]
name = "curling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stan", email = "zyyu@umich.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "gymnasium>=1.4.0",
    "huggingface-hub>=2.2.0",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
curling = "curling:main"
data = "curling.data:main"
train = "curling.model.trainer:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lefthook>=2.2.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
